<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Lifeline unit schematic</title>
  <defs>
    <!-- Resistor, horizontal, 60 px long, anchored at its left lead. -->
    <path id="res" d="M0 0 h10 l4 -8 l8 16 l8 -16 l8 16 l8 -16 l4 8 h14" fill="none" stroke="#111" stroke-width="2"/>
    <!-- Ground symbol, anchored at the top of its stem. -->
    <g id="gnd" stroke="#111" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="10"/>
      <line x1="-12" y1="10" x2="12" y2="10"/>
      <line x1="-7" y1="15" x2="7" y2="15"/>
      <line x1="-2" y1="20" x2="2" y2="20"/>
    </g>
  </defs>

  <rect width="960" height="640" fill="#fff"/>
  <text x="40" y="38" font-size="20" font-weight="bold">Lifeline unit: wall-power sense + battery backup</text>

  <g fill="none" stroke="#111" stroke-width="2">
    <!-- Blocks -->
    <rect x="40" y="70" width="160" height="110" rx="4"/>
    <rect x="40" y="225" width="160" height="245" rx="4"/>
    <rect x="700" y="60" width="200" height="420" rx="4"/>

    <!-- Wall-sense divider: J1 VBUS -> R1 -> GPIO34, R2 to GND -->
    <path d="M200 105 H300 M360 105 H700"/>
    <path d="M420 105 V125"/>
    <path d="M200 150 H240 V165"/>

    <!-- Battery divider: BAT+ -> R3 -> GPIO35, R4 to GND -->
    <path d="M200 245 H300 M360 245 H700"/>
    <path d="M420 245 V265"/>

    <!-- 5 V supply rail with hold-up capacitor -->
    <path d="M200 400 H700"/>
    <path d="M600 400 V412 M600 422 V440"/>
    <path d="M200 440 H240 V455"/>

    <!-- ESP32 ground -->
    <path d="M700 450 H660 V465"/>
  </g>

  <!-- Resistors -->
  <use href="#res" x="300" y="105"/>
  <use href="#res" transform="translate(420 125) rotate(90)"/>
  <use href="#res" x="300" y="245"/>
  <use href="#res" transform="translate(420 265) rotate(90)"/>

  <!-- C1: polarised, + on top -->
  <g stroke="#111" stroke-width="2">
    <line x1="586" y1="412" x2="614" y2="412"/>
    <path d="M586 424 Q600 416 614 424" fill="none"/>
  </g>

  <!-- Grounds -->
  <use href="#gnd" x="420" y="185"/>
  <use href="#gnd" x="240" y="165"/>
  <use href="#gnd" x="420" y="325"/>
  <use href="#gnd" x="600" y="440"/>
  <use href="#gnd" x="240" y="455"/>
  <use href="#gnd" x="660" y="465"/>

  <!-- Junction dots -->
  <g fill="#111">
    <circle cx="420" cy="105" r="4"/>
    <circle cx="420" cy="245" r="4"/>
    <circle cx="600" cy="400" r="4"/>
  </g>

  <!-- Block labels -->
  <text x="52" y="92" font-weight="bold">J1 sense adapter</text>
  <text x="52" y="126">5 V USB charger on</text>
  <text x="52" y="142">the same strip as</text>
  <text x="52" y="158">the medical device</text>
  <text x="160" y="101" font-size="11">VBUS</text>
  <text x="168" y="146" font-size="11">GND</text>

  <text x="52" y="270" font-weight="bold">B1 backup power</text>
  <text x="52" y="290">pass-through bank,</text>
  <text x="52" y="306">or 18650 + TP4056</text>
  <text x="52" y="322">(load sharing)</text>
  <text x="52" y="338">+ 5 V boost converter</text>
  <text x="156" y="241" font-size="11">BAT+</text>
  <text x="152" y="396" font-size="11">5V OUT</text>
  <text x="168" y="436" font-size="11">GND</text>

  <text x="712" y="84" font-weight="bold">U1 ESP32 dev board</text>
  <text x="712" y="109">GPIO34 (input only)</text>
  <text x="712" y="249">GPIO35 (input only)</text>
  <text x="712" y="320" fill="#555">GPIO2: onboard status LED</text>
  <text x="712" y="340" fill="#555">USB: flashing + serial log</text>
  <text x="712" y="404">5V / VIN</text>
  <text x="712" y="454">GND</text>

  <!-- Part labels -->
  <text x="310" y="88">R1 10 kΩ</text>
  <text x="434" y="160">R2 20 kΩ</text>
  <text x="310" y="228">R3 100 kΩ</text>
  <text x="434" y="300">R4 100 kΩ</text>
  <text x="622" y="420">C1 1000 µF</text>
  <text x="590" y="409" font-size="11">+</text>
  <text x="470" y="96" fill="#555">≈3.3 V wall on, 0 V wall off</text>
  <text x="470" y="236" fill="#555">½ cell voltage (optional)</text>
  <text x="250" y="392" fill="#555">5 V, stays up when the wall dies</text>

  <!-- Notes -->
  <g font-size="12.5">
    <text x="40" y="530" font-weight="bold">Notes</text>
    <text x="40" y="550">1. Every ground symbol is one net. J1's GND must join the ESP32 GND or GPIO34 floats.</text>
    <text x="40" y="568">2. R1/R2: 5.0 V × 20k/30k = 3.33 V. A 5.25 V charger gives 3.5 V, still under the 3.6 V pin limit.</text>
    <text x="40" y="586">3. R3/R4 only with the 18650 option. A power bank hides its cell: set BATTERY_ADC_PIN to -1 in config.h.</text>
    <text x="40" y="604">4. C1 rides through the blip some power banks make when their input drops. Low voltage only, no mains wiring.</text>
  </g>
</svg>
